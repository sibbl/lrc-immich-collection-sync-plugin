name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "ERROR: Tag must match vMAJOR.MINOR.PATCH (got '$TAG')." >&2
              exit 1
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install LuaJIT, luacheck & zip
        run: sudo apt-get update && sudo apt-get install -y luajit lua-check zip

      - name: Lint and run unit tests
        run: |
          luacheck src tests
          ./test.sh

      - name: Sync Info.lua VERSION with release tag
        run: |
          VER="${{ steps.meta.outputs.tag }}"
          VER="${VER#v}"
          IFS='.' read -r MAJOR MINOR REV <<< "${VER%%-*}"
          sed -i "s/VERSION = { major = [0-9]*, minor = [0-9]*, revision = [0-9]*, build = [0-9]* }/VERSION = { major = ${MAJOR}, minor = ${MINOR}, revision = ${REV}, build = 0 }/" src/Info.lua
          grep "VERSION =" src/Info.lua

      - name: Build and package .lrplugin zip
        run: |
          ./build.sh
          (cd dist && zip -r "lrc-immich-collection-sync-plugin.lrplugin.zip" "lrc-immich-collection-sync-plugin.lrplugin" -x '*.DS_Store' '*.git*')
          ls -lh dist/lrc-immich-collection-sync-plugin.lrplugin.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ZIP="dist/lrc-immich-collection-sync-plugin.lrplugin.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --title "Immich Collection Sync ${TAG}" \
              --generate-notes
          fi
